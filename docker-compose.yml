services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tenantforge-app:latest
    container_name: tenantforge-app
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8443:443"
      - "8443:443/udp" # HTTP/3
    environment:
      SERVER_NAME: ":80"
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      APP_NAME: TenantForge
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      CENTRAL_DOMAIN: localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: log
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_data:/var/www/html/storage
      - database_data:/var/www/html/database
      - caddy_data:/data
      - caddy_config:/config

  queue:
    image: tenantforge-app:latest
    container_name: tenantforge-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    environment:
      APP_NAME: TenantForge
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: log
    volumes:
      - storage_data:/var/www/html/storage
      - database_data:/var/www/html/database
    depends_on:
      - app

volumes:
  storage_data:
  database_data:
  caddy_data:
  caddy_config:
